<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Trang Giáo Viên — Quản lý Học viên (VSTEP Writing)</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./style.css?v=4.7" />
</head>
<body>
  <div id="teacher-app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js?v=4.6"></script>
  <script src="./supabase-client.js?v=4.11"></script>
  <script>
    (function () {
      const CLOUD = window.WritingCloud;
      const LESSONS = CLOUD.LESSONS_CATALOG || [];
      const escapeHtml = CLOUD.escapeHtml;
      const RELEASE_HOURS = 6;

      const TASKS_CATALOG = [
        { id: "task1", label: "Task 01 - Viết Thư", shortLabel: "Task 01" },
        { id: "task2", label: "Task 02 - Viết Luận", shortLabel: "Task 02" }
      ];

      const LEVEL_FILTER_OPTIONS = [
        { value: "all", label: "Tất cả trình độ" },
        { value: "B1", label: "Mục tiêu B1" },
        { value: "B2", label: "Mục tiêu B2" },
        { value: "C1", label: "Mục tiêu C1" }
      ];

      const lessonById = {};
      LESSONS.forEach(item => {
        lessonById[item.id] = item;
      });

      const tState = {
        checkingAuth: true,
        loading: false,
        authenticated: false,
        unauthorizedEmail: "",
        teacherEmail: "",
        teacherUserId: "",
        accountMenuOpen: false,
        infoModalStudentId: "",
        selectedStudentId: "", // "" = danh sách học viên | "<uuid>" = xem bài viết của học viên đó
        deletingUserId: "",
        deletingSubId: "",
        gradingSubId: "",
        releasingSubId: "",
        flushingQueue: false,
        flushProgressText: "",
        authError: "",
        dbError: "",
        students: [],
        submissions: [],
        submissionsByStudentId: {},
        reviewJsonBySubId: {},
        loadedReviewStudents: new Set(),
        loadingReviewStudentId: "",
        openDetailsSubIds: new Set(),
        draftGradesBySubId: {},
        filterClass: "all", // "all" | CLASS_LIST... | "unassigned"
        filterLevel: "all", // "all" | "B1" | "B2"
        filterTask: "all", // "all" | "task1" | "task2"
        filterLesson: "all",
        filterStatus: "all", // "all" | "unread_review" | "ungraded" | "graded"
        savedToastId: ""
      };

      let verifyingUserId = null;
      let refreshInFlight = false;

      function isHiddenAdminAccount(email, rawName, userId) {
        const lowerEmail = String(email || "").trim().toLowerCase();
        const lowerName = String(rawName || "").trim().toLowerCase();
        return (
          lowerEmail === "mtung0208@gmail.com" ||
          lowerEmail.startsWith("mtung0208@") ||
          lowerName === "mtung0208" ||
          (tState.teacherUserId && userId === tState.teacherUserId)
        );
      }

      function getTeacherDisplayName(email) {
        const lower = String(email || "").trim().toLowerCase();
        if (lower === "mtung0208@gmail.com" || lower.startsWith("mtung0208@")) {
          return "admin";
        }
        return email ? email.split("@")[0] : "admin";
      }

      function getTaskShortLabel(taskType) {
        return taskType === "task1" ? "Task 01" : "Task 02";
      }

      function getBandToneClass(bandText) {
        const lower = String(bandText || "").toLowerCase();
        if (
          lower.includes("không đạt") ||
          lower.includes("chưa đạt") ||
          lower.includes("dưới") ||
          /\ba[12]\b/.test(lower)
        ) {
          return "band-below";
        }
        if (lower.includes("xấp xỉ") || lower.includes("gần")) {
          return "band-approx";
        }
        return "band-achieved";
      }

      function captureDraftGradesFromDom() {
        document.querySelectorAll("[data-save-grade]").forEach(btn => {
          const subId = btn.getAttribute("data-save-grade");
          if (!subId) return;
          const scoreInp = document.getElementById("inp-score-" + subId);
          const fbInp = document.getElementById("inp-fb-" + subId);
          if (!scoreInp && !fbInp) return;
          const sub = tState.submissions.find(s => s.submissionId === subId);
          const scoreVal = scoreInp ? scoreInp.value : "";
          const fbVal = fbInp ? fbInp.value : "";
          const origScore = sub ? sub.teacherScore || "" : "";
          const origFb = sub ? sub.teacherFeedback || "" : "";
          if (scoreVal !== origScore || fbVal !== origFb) {
            tState.draftGradesBySubId[subId] = { score: scoreVal, feedback: fbVal };
          } else {
            delete tState.draftGradesBySubId[subId];
          }
        });
      }

      // ======================================================================
      // CLOUD DATA LOADER (SUPABASE + SERVER-SIDE RLS VERIFICATION)
      // ======================================================================
      async function verifyAndLoadCloudTeacher(user) {
        const client = CLOUD.getClient();
        if (!client || !user) {
          tState.checkingAuth = false;
          renderTeacherApp();
          return;
        }
        if (verifyingUserId === user.id) return;
        verifyingUserId = user.id;

        try {
          tState.checkingAuth = true;
          tState.loading = true;
          tState.authError = "";
          tState.unauthorizedEmail = "";
          renderTeacherApp();

          const { data: isTeacherFlag, error: rpcError } = await client.rpc("is_teacher");
          if (rpcError || !isTeacherFlag) {
            tState.checkingAuth = false;
            tState.loading = false;
            tState.authenticated = false;
            tState.unauthorizedEmail = user.email || "";
            renderTeacherApp();
            return;
          }

          tState.checkingAuth = false;
          tState.authenticated = true;
          tState.teacherEmail = user.email || "";
          tState.teacherUserId = user.id || "";
          await refreshCloudDashboardData();
        } finally {
          if (verifyingUserId === user.id) {
            verifyingUserId = null;
          }
        }
      }

      async function fetchLightReviewsPaginated(client) {
        const lightCols =
          "submission_id, user_id, task_type, lesson_id, lesson_title, target_level, status, release_at, error_message, grade_count, retry_count, student_seen_at, updated_at, estimated_band:review_json->>estimated_band";
        const lightRes = await CLOUD.fetchAllPages(
          () => client.from("writing_ai_reviews").select(lightCols).order("submission_id", { ascending: true }),
          1000
        );
        if (!lightRes.error) {
          return lightRes;
        }
        // Fallback nếu bản PostgREST/schema cũ không hỗ trợ JSON projection
        return CLOUD.fetchAllPages(
          () => client.from("writing_ai_reviews").select("*").order("submission_id", { ascending: true }),
          1000
        );
      }

      async function ensureStudentReviewsLoaded(studentId) {
        const client = CLOUD.getClient();
        if (!client || !studentId) return;
        if (tState.loadedReviewStudents.has(studentId) || tState.loadingReviewStudentId === studentId) {
          return;
        }
        tState.loadingReviewStudentId = studentId;
        renderTeacherApp();

        try {
          const { data, error } = await client
            .from("writing_ai_reviews")
            .select("submission_id, review_json")
            .eq("user_id", studentId);

          if (!error && Array.isArray(data)) {
            data.forEach(row => {
              if (row && row.submission_id && row.review_json) {
                tState.reviewJsonBySubId[row.submission_id] = row.review_json;
              }
            });
            tState.submissions.forEach(sub => {
              if (sub.studentId === studentId && sub.aiReview && tState.reviewJsonBySubId[sub.submissionId]) {
                sub.aiReview.review_json = tState.reviewJsonBySubId[sub.submissionId];
              }
            });
            tState.loadedReviewStudents.add(studentId);
          }
        } catch (e) {} finally {
          if (tState.loadingReviewStudentId === studentId) {
            tState.loadingReviewStudentId = "";
          }
          renderTeacherApp();
        }
      }

      async function refreshCloudDashboardData() {
        const client = CLOUD.getClient();
        if (!client || refreshInFlight) return;
        refreshInFlight = true;

        tState.loading = true;
        tState.dbError = "";
        renderTeacherApp();

        try {
          const [profilesRes, subsRes, reviewsRes] = await Promise.all([
            CLOUD.fetchAllPages(
              () => client.from("profiles").select("*").order("last_active_at", { ascending: false }),
              1000
            ),
            CLOUD.fetchAllPages(
              () => client.from("writing_submissions").select("*").order("submitted_at", { ascending: false }),
              1000
            ),
            fetchLightReviewsPaginated(client)
          ]);

          const firstErr = profilesRes.error || subsRes.error || reviewsRes.error;
          if (firstErr) {
            tState.dbError =
              "Không thể đọc dữ liệu từ Supabase (" +
              (firstErr.code ? firstErr.code + ": " : "") +
              firstErr.message +
              "). Vui lòng mở Supabase SQL Editor và chạy file supabase-setup.sql để tạo bảng writing_submissions và cấp quyền GRANT.";
          }

          const rawProfiles = Array.isArray(profilesRes.data) ? profilesRes.data : [];
          const subRows = Array.isArray(subsRes.data) ? subsRes.data : [];
          const reviewRows = Array.isArray(reviewsRes.data) ? reviewsRes.data : [];

          // Làm mới cache chi tiết bài sửa AI để luôn đồng bộ bản mới nhất
          tState.reviewJsonBySubId = {};
          tState.loadedReviewStudents.clear();
          tState.draftGradesBySubId = {};

          // Loại bỏ tài khoản admin khỏi danh sách học viên & thống kê
          const hiddenAdminIds = new Set();
          rawProfiles.forEach(p => {
            if (isHiddenAdminAccount(p.email, p.full_name, p.id)) {
              hiddenAdminIds.add(p.id);
            }
          });
          const profiles = rawProfiles.filter(p => !hiddenAdminIds.has(p.id));

          const reviewBySubId = {};
          reviewRows.forEach(r => {
            if (r && r.submission_id) {
              if (r.review_json) {
                tState.reviewJsonBySubId[r.submission_id] = r.review_json;
              }
              reviewBySubId[r.submission_id] = r;
            }
          });

          const profileById = {};
          const parsedById = {};
          profiles.forEach(p => {
            profileById[p.id] = p;
            parsedById[p.id] = CLOUD.parseFullNameAndClass(p.full_name || "");
          });

          const submittedCountByUser = {};
          const task1CountByUser = {};
          const task2CountByUser = {};
          const submissions = [];
          const submissionsByStudentId = {};
          const nowMs = Date.now();

          subRows.forEach(row => {
            if (!row || hiddenAdminIds.has(row.user_id)) return;
            const prof = profileById[row.user_id] || {
              id: row.user_id,
              full_name: "Học viên",
              email: "",
              auth_provider: "email"
            };
            if (isHiddenAdminAccount(prof.email, prof.full_name, prof.id)) return;

            const parsedProf = parsedById[row.user_id] || CLOUD.parseFullNameAndClass(prof.full_name || "");
            const catalogItem = lessonById[row.lesson_id];
            const taskType = row.task_type || (catalogItem ? catalogItem.taskType : "task2");
            const lessonTitle = (catalogItem && catalogItem.title) || row.lesson_title || row.lesson_id;
            const isSubmitted = Boolean(row.is_submitted);

            if (isSubmitted) {
              submittedCountByUser[row.user_id] = (submittedCountByUser[row.user_id] || 0) + 1;
              if (taskType === "task1") {
                task1CountByUser[row.user_id] = (task1CountByUser[row.user_id] || 0) + 1;
              } else {
                task2CountByUser[row.user_id] = (task2CountByUser[row.user_id] || 0) + 1;
              }
            }

            const activeAiReview = reviewBySubId[row.id] || null;
            const rj = (activeAiReview && activeAiReview.review_json) || tState.reviewJsonBySubId[row.id] || null;
            const hasReadyReview = Boolean(activeAiReview && activeAiReview.status === "ready");
            const relMs = activeAiReview && activeAiReview.release_at ? new Date(activeAiReview.release_at).getTime() : 0;
            const isReviewReleased = hasReadyReview && relMs > 0 && relMs <= nowMs;
            const isReviewSeen = isReviewReleased && Boolean(activeAiReview.student_seen_at);
            const evaluatedBand = String(
              (rj && rj.estimated_band) || (activeAiReview && activeAiReview.estimated_band) || ""
            ).trim();

            const ts = row.submitted_at || row.updated_at || row.created_at;
            const subObj = {
              submissionId: row.id,
              studentId: row.user_id,
              studentName: parsedProf.fullName || prof.email || "Học viên",
              studentClass: parsedProf.className || "",
              studentEmail: prof.email || "",
              taskType,
              taskLabel: getTaskShortLabel(taskType),
              lessonId: row.lesson_id,
              lessonTitle,
              promptText: row.prompt_text || "",
              content: row.content || "",
              wordCount: row.word_count || 0,
              targetLevel: CLOUD.inferTargetLevelFromClass(
                parsedProf.className,
                row.target_level || (activeAiReview && activeAiReview.target_level) || "B1"
              ),
              evaluatedBand,
              isSubmitted,
              isReviewReleased,
              isReviewSeen,
              submittedAt: CLOUD.formatDateTime(ts),
              rawTime: new Date(ts || 0).getTime(),
              teacherFeedback: row.teacher_feedback || "",
              teacherScore: row.teacher_score || "",
              aiStatus: row.ai_status || "",
              aiReleaseAt: row.ai_release_at || "",
              aiReview: activeAiReview
            };
            submissions.push(subObj);
            if (!submissionsByStudentId[row.user_id]) {
              submissionsByStudentId[row.user_id] = [];
            }
            submissionsByStudentId[row.user_id].push(subObj);
          });

          submissions.sort((a, b) => (b.rawTime || 0) - (a.rawTime || 0));
          Object.values(submissionsByStudentId).forEach(arr => {
            arr.sort((a, b) => (b.rawTime || 0) - (a.rawTime || 0));
          });

          tState.students = profiles.map(p => {
            const parsedProf = parsedById[p.id] || CLOUD.parseFullNameAndClass(p.full_name || "");
            return {
              id: p.id,
              name: parsedProf.fullName || p.email,
              className: parsedProf.className || "",
              email: p.email,
              authProvider: p.auth_provider || "email",
              createdAt: CLOUD.formatDateTime(p.created_at),
              lastActiveAt: CLOUD.formatDateTime(p.last_active_at),
              submittedCount: submittedCountByUser[p.id] || 0,
              task1Count: task1CountByUser[p.id] || 0,
              task2Count: task2CountByUser[p.id] || 0
            };
          });

          tState.submissions = submissions;
          tState.submissionsByStudentId = submissionsByStudentId;

          if (tState.selectedStudentId && !tState.students.some(s => s.id === tState.selectedStudentId)) {
            tState.selectedStudentId = "";
          }
          if (tState.infoModalStudentId && !tState.students.some(s => s.id === tState.infoModalStudentId)) {
            tState.infoModalStudentId = "";
          }
          tState.loading = false;
          renderTeacherApp();

          if (tState.selectedStudentId) {
            ensureStudentReviewsLoaded(tState.selectedStudentId);
          }
        } finally {
          refreshInFlight = false;
        }
      }

      // ======================================================================
      // TEACHER ACTIONS (GRADE, AI REVIEW, RELEASE, DELETE STUDENT/SUBMISSION)
      // ======================================================================
      async function saveCloudGrade(submissionId, scoreVal, feedbackVal) {
        const client = CLOUD.getClient();
        if (!client) return;
        const { error } = await client
          .from("writing_submissions")
          .update({
            teacher_score: scoreVal,
            teacher_feedback: feedbackVal
          })
          .eq("id", submissionId);

        if (!error) {
          const item = tState.submissions.find(s => s.submissionId === submissionId);
          if (item) {
            item.teacherScore = scoreVal;
            item.teacherFeedback = feedbackVal;
          }
          delete tState.draftGradesBySubId[submissionId];
          tState.savedToastId = submissionId;
          renderTeacherApp();
          setTimeout(() => {
            if (tState.savedToastId === submissionId) {
              tState.savedToastId = "";
              renderTeacherApp();
            }
          }, 2200);
        } else {
          alert("Lỗi lưu nhận xét: " + error.message);
        }
      }

      async function triggerTeacherAiGrade(submissionId) {
        if (!submissionId || tState.gradingSubId) return;
        tState.gradingSubId = submissionId;
        tState.openDetailsSubIds.add(submissionId);
        renderTeacherApp();

        const res = await CLOUD.invokeGradeWriting(submissionId, {
          forceTeacher: true,
          releaseNow: false
        });
        tState.gradingSubId = "";
        if (!res.ok) {
          renderTeacherApp();
          alert(
            "Không chạy được chấm sửa AI: " +
              (res.error || "Vui lòng kiểm tra đã deploy Edge Function grade-writing và cài GEMINI_API_KEY chưa.")
          );
          return;
        }
        await refreshCloudDashboardData();
      }

      async function releaseAiReviewNow(submissionId) {
        const client = CLOUD.getClient();
        if (!client || !submissionId || tState.releasingSubId) return;
        tState.releasingSubId = submissionId;
        renderTeacherApp();

        const { error } = await client.rpc("teacher_release_review_now", { p_submission_id: submissionId });
        tState.releasingSubId = "";
        if (error) {
          renderTeacherApp();
          alert("Không trả bài sớm được: " + error.message);
          return;
        }
        await refreshCloudDashboardData();
      }

      async function flushPendingQueueNow() {
        if (tState.flushingQueue) return;
        tState.flushingQueue = true;
        tState.flushProgressText = "⏳ Đang xử lý...";
        renderTeacherApp();

        let totalProcessed = 0;
        let totalSucceeded = 0;
        let lastRemaining = 0;
        let lastError = "";
        const maxBatches = 15;

        for (let b = 0; b < maxBatches; b++) {
          const res = await CLOUD.invokeProcessQueue(5);
          if (!res.ok) {
            lastError = res.error || "Lỗi không xác định";
            break;
          }
          totalProcessed += Number(res.processed || 0);
          totalSucceeded += Number(res.succeeded || 0);
          lastRemaining = Number(res.pending_remaining || 0);

          tState.flushProgressText = `⏳ Xong ${totalSucceeded} bài...`;
          renderTeacherApp();

          if (lastRemaining <= 0 || Number(res.processed || 0) === 0 || Number(res.succeeded || 0) === 0) {
            break;
          }
        }

        tState.flushingQueue = false;
        tState.flushProgressText = "";

        if (totalProcessed === 0 && lastError) {
          renderTeacherApp();
          alert("Không chạy được hàng đợi chấm bài: " + lastError);
          return;
        }

        await refreshCloudDashboardData();
        const extraNote = lastError ? `\n\nGhi chú: ${lastError}` : "";
        alert(
          `Đã xử lý ${totalProcessed} bài chờ: thành công ${totalSucceeded} bài, còn đang chờ ${lastRemaining} bài.${extraNote}`
        );
      }

      async function deleteStudentAccount(studentId, studentName, studentEmail) {
        const client = CLOUD.getClient();
        if (!client || !studentId || tState.deletingUserId) return;
        if (studentId === tState.teacherUserId) {
          alert("Không thể tự xoá tài khoản Giáo viên đang đăng nhập.");
          return;
        }
        const label = studentName ? `${studentName} (${studentEmail || ""})` : studentEmail || studentId;
        if (
          !confirm(
            `Bạn có chắc muốn XOÁ VĨNH VIỄN tài khoản "${label}"?\n\nToàn bộ bài viết (và dữ liệu Speaking dùng chung tài khoản này trên Supabase) sẽ bị xoá khỏi hệ thống.`
          )
        ) {
          return;
        }

        tState.deletingUserId = studentId;
        renderTeacherApp();

        try {
          const { error } = await client.rpc("teacher_delete_student", { target_user_id: studentId });
          if (error) {
            tState.deletingUserId = "";
            renderTeacherApp();
            alert(
              "Không xoá được tài khoản: " +
                error.message +
                "\n\nLưu ý: Vui lòng chạy file supabase-setup.sql mới nhất trong Supabase SQL Editor để kích hoạt hàm teacher_delete_student."
            );
            return;
          }

          if (tState.selectedStudentId === studentId) {
            tState.selectedStudentId = "";
          }
          tState.infoModalStudentId = "";
          tState.deletingUserId = "";
          await refreshCloudDashboardData();
        } catch (err) {
          tState.deletingUserId = "";
          renderTeacherApp();
          alert("Lỗi khi xoá tài khoản: " + (err && err.message ? err.message : "Không xác định"));
        }
      }

      async function deleteSubmissionForRetry(submissionId) {
        const client = CLOUD.getClient();
        if (!client || !submissionId || tState.deletingSubId) return;
        const sub = tState.submissions.find(s => s.submissionId === submissionId);
        if (!sub) return;

        if (
          !confirm(
            `Bạn có chắc muốn XOÁ bài viết "${sub.lessonTitle}" của học viên "${sub.studentName}" để bạn ấy làm lại?\n\nBài viết và bài sửa AI của đề này sẽ bị gỡ bỏ.`
          )
        ) {
          return;
        }

        tState.deletingSubId = submissionId;
        renderTeacherApp();

        try {
          await client.from("writing_ai_reviews").delete().eq("submission_id", submissionId);
          const { data: deletedRows, error: delErr } = await client
            .from("writing_submissions")
            .delete()
            .eq("id", submissionId)
            .select("id");

          if (delErr) {
            tState.deletingSubId = "";
            renderTeacherApp();
            alert("Không xoá được bài nộp: " + delErr.message);
            return;
          }

          if (!Array.isArray(deletedRows) || deletedRows.length === 0) {
            tState.deletingSubId = "";
            renderTeacherApp();
            alert(
              "Supabase chưa xoá được bài nộp (0 dòng bị xoá). Vui lòng kiểm tra policy DELETE trên bảng writing_submissions trong supabase-setup.sql."
            );
            return;
          }

          tState.openDetailsSubIds.delete(submissionId);
          delete tState.draftGradesBySubId[submissionId];
          tState.deletingSubId = "";
          await refreshCloudDashboardData();
        } catch (err) {
          tState.deletingSubId = "";
          renderTeacherApp();
          alert("Lỗi khi xoá bài nộp: " + (err && err.message ? err.message : "Không xác định"));
        }
      }

      // ======================================================================
      // FILTERING LOGIC (LỚP, TRÌNH ĐỘ, PHẦN THI, ĐỀ / CHỦ ĐỀ)
      // ======================================================================
      function matchesClassFilter(clsName) {
        if (tState.filterClass === "all") return true;
        if (tState.filterClass === "unassigned") return !clsName;
        return clsName === tState.filterClass;
      }

      function matchesTaskFilter(taskType) {
        if (tState.filterTask === "all") return true;
        return taskType === tState.filterTask;
      }

      function matchesLessonFilter(lessonId) {
        if (tState.filterLesson === "all") return true;
        return lessonId === tState.filterLesson;
      }

      function matchesLevelFilter(sub) {
        if (tState.filterLevel === "all") return true;
        return String(sub.targetLevel || "B1").toUpperCase() === tState.filterLevel;
      }

      function hasAnyFeedbackOrReview(sub) {
        if (!sub) return false;
        const hasManual = Boolean(
          (sub.teacherFeedback && sub.teacherFeedback.trim()) ||
            (sub.teacherScore && sub.teacherScore.trim())
        );
        const hasReadyAi = Boolean(sub.aiReview && sub.aiReview.status === "ready");
        return hasManual || hasReadyAi;
      }

      function getVisibleLessonsForTask() {
        if (tState.filterTask === "all") return LESSONS;
        return LESSONS.filter(item => item.taskType === tState.filterTask);
      }

      function getLessonsTotalForScope() {
        if (tState.filterLesson !== "all") return 1;
        return getVisibleLessonsForTask().length;
      }

      function getStudentScopedMetrics(studentId) {
        const allForStudent = tState.submissionsByStudentId[studentId] || [];
        const userSubs = allForStudent.filter(sub => {
          if (!matchesTaskFilter(sub.taskType)) return false;
          if (!matchesLessonFilter(sub.lessonId)) return false;
          if (!matchesLevelFilter(sub)) return false;
          return true;
        });

        const submittedSubs = userSubs.filter(s => s.isSubmitted);
        const releasedCount = submittedSubs.filter(s => s.isReviewReleased).length;
        const seenCount = submittedSubs.filter(s => s.isReviewSeen).length;
        const pendingCount = submittedSubs.filter(s => !s.isReviewReleased).length;

        return {
          matchedTotal: userSubs.length,
          submittedCount: submittedSubs.length,
          releasedCount,
          seenCount,
          pendingCount
        };
      }

      function getFilteredStudents() {
        const hasContentFilter =
          tState.filterLevel !== "all" ||
          tState.filterTask !== "all" ||
          tState.filterLesson !== "all";

        return tState.students
          .filter(st => matchesClassFilter(st.className))
          .map(st => ({
            ...st,
            metrics: getStudentScopedMetrics(st.id)
          }))
          .filter(st => (!hasContentFilter ? true : st.metrics.matchedTotal > 0));
      }

      function getFilteredSubmissionsForStudent(studentId) {
        const source = studentId
          ? (tState.submissionsByStudentId[studentId] || [])
          : tState.submissions;

        return source.filter(sub => {
          if (!studentId && !matchesClassFilter(sub.studentClass)) return false;
          if (!matchesTaskFilter(sub.taskType)) return false;
          if (!matchesLessonFilter(sub.lessonId)) return false;
          if (!matchesLevelFilter(sub)) return false;
          if (tState.filterStatus === "unread_review" && (!sub.isReviewReleased || sub.isReviewSeen)) return false;
          if (tState.filterStatus === "ungraded" && hasAnyFeedbackOrReview(sub)) return false;
          if (tState.filterStatus === "graded" && !hasAnyFeedbackOrReview(sub)) return false;
          return true;
        });
      }

      function hasActiveFilters(isDetailView) {
        if (isDetailView) {
          return (
            tState.filterLevel !== "all" ||
            tState.filterTask !== "all" ||
            tState.filterLesson !== "all" ||
            tState.filterStatus !== "all"
          );
        }
        return (
          tState.filterClass !== "all" ||
          tState.filterLevel !== "all" ||
          tState.filterTask !== "all" ||
          tState.filterLesson !== "all"
        );
      }

      // ======================================================================
      // EXPORT CSV (EXCEL-READY WITH UTF-8 BOM & FORMULA INJECTION GUARD)
      // ======================================================================
      function exportCsvReport(rows) {
        const csvCell = v => {
          let str = String(v || "");
          if (/^[=+\-@\t\r]/.test(str)) {
            str = "'" + str;
          }
          return `"${str.replace(/"/g, '""')}"`;
        };
        const header = [
          "Học viên",
          "Lớp",
          "Email",
          "Phần thi",
          "Đề / Chủ đề",
          "Mục tiêu Level",
          "Đánh giá AI",
          "Đã đọc bài sửa",
          "Số từ",
          "Thời gian nộp",
          "Nội dung bài viết",
          "Điểm / Band (GV)",
          "Nhận xét giáo viên"
        ];
        const lines = [header.map(csvCell).join(",")];
        rows.forEach(sub => {
          const readLabel = !sub.isSubmitted
            ? "—"
            : sub.isReviewReleased
              ? sub.isReviewSeen
                ? "Đã đọc"
                : "Chưa đọc"
              : "Chờ trả bài";
          lines.push(
            [
              sub.studentName,
              sub.studentClass || "—",
              sub.studentEmail,
              sub.taskType === "task1" ? "Task 01 (Viết Thư)" : "Task 02 (Viết Luận)",
              sub.lessonTitle,
              sub.targetLevel || "B1",
              sub.evaluatedBand || "",
              readLabel,
              sub.wordCount || 0,
              sub.submittedAt,
              sub.content,
              sub.teacherScore,
              sub.teacherFeedback
            ]
              .map(csvCell)
              .join(",")
          );
        });
        const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `bao-cao-vstep-writing-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

                        ? ` — ${escapeHtml(String(rev.error_message).slice(0, 120))}`
                        : "";
                      statusHtml = `<span style="font-size:12.5px;font-weight:700;color:#B45309;">🔄 Hệ thống đang chờ chấm lại (lần thử ${tries}/20)${errDetail}</span>`;
                    } else if (rev && rev.status === "skipped") {
                      statusHtml = `<span style="font-size:12.5px;color:#52525B;">Bài viết dưới 50 từ nên không chấm tự động.</span>`;
                    } else if (isOverdueUngraded) {
                      statusHtml = `<span style="font-size:12.5px;font-weight:700;color:#B91C1C;">⚠️ Đã quá hạn ${RELEASE_HOURS} giờ nhưng chưa có bài sửa — bấm “Tạo bài sửa” để chấm ngay.</span>`;
                    } else if (sub.aiStatus === "pending" || sub.aiStatus === "pending_retry" || sub.aiStatus === "grading") {
                      statusHtml = `<span style="font-size:12.5px;font-weight:700;color:#92400E;">⏳ Đang trong hàng đợi chấm tự động (trả chậm nhất sau ${RELEASE_HOURS} giờ).</span>`;
                    }

                    const draft = tState.draftGradesBySubId[sub.submissionId];
                    const scoreVal = draft ? draft.score : sub.teacherScore;
                    const fbVal = draft ? draft.feedback : sub.teacherFeedback;
                    const isDetailsOpen = tState.openDetailsSubIds.has(sub.submissionId);
                    const errCountText = errCount !== null ? `${errCount} lỗi - ` : "";

                    return `
                      <div class="submission-review-card">
                        <div class="submission-review-top">
                          <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;">
                            <span style="font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:4px;${taskBadgeStyle}">
                              ${escapeHtml(sub.taskLabel)}
                            </span>
                            <span style="font-size:12.5px;font-weight:700;color:#18181B;background:#FAF8F3;border:1px solid #E4E4E7;padding:2px 8px;border-radius:4px;">
                              ${escapeHtml(sub.lessonTitle)}
                            </span>
                            <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;font-weight:700;color:#27272A;background:#F4F4F5;padding:2px 8px;border-radius:4px;">
                              Level ${escapeHtml(sub.targetLevel)} - ${sub.wordCount} từ
                            </span>
                            ${
                              sub.evaluatedBand
                                ? `<span class="ai-band-badge ${getBandToneClass(sub.evaluatedBand)}">${escapeHtml(sub.evaluatedBand)}</span>`
                                : ""
                            }
                          </div>

                          <div>
                            <span class="submitted-badge">✓ Đã nộp (${escapeHtml(sub.submittedAt || "")})</span>
                          </div>
                        </div>

                        ${
                          sub.promptText
                            ? `<div class="teacher-prompt-snippet"><strong>Đề bài:</strong> ${escapeHtml(sub.promptText)}</div>`
                            : ""
                        }

                        <div class="teacher-writing-body">${escapeHtml(sub.content || "(Bài viết trống)")}</div>

                        <div class="teacher-ai-bar">
                          <div>${statusHtml}</div>
                          <div class="teacher-ai-actions">
                            ${
                              isWaitingRelease
                                ? `<button type="button" class="top-pill-btn yellow" data-release-now="${escapeHtml(sub.submissionId)}" ${isReleasing ? "disabled" : ""}>
                                    ${isReleasing ? "Đang trả..." : "⚡ Trả bài sửa ngay"}
                                  </button>`
                                : ""
                            }
                            <button type="button" class="top-pill-btn" data-ai-grade="${escapeHtml(sub.submissionId)}" ${isGrading ? "disabled" : ""}>
                              ${isGrading ? "⏳ Đang chấm..." : hasReadyReview ? "↻ Chấm lại" : "✨ Tạo bài sửa"}
                            </button>
                            <button
                              type="button"
                              class="top-pill-btn"
                              style="color:#B91C1C;border-color:#FCA5A5;background:#FEF2F2;"
                              data-delete-submission="${escapeHtml(sub.submissionId)}"
                              ${tState.deletingSubId === sub.submissionId ? "disabled" : ""}
                              title="Xoá bài nộp này để học viên viết lại"
                            >
                              ${tState.deletingSubId === sub.submissionId ? "Đang xoá..." : "🗑️ Xoá bài nộp"}
                            </button>
                          </div>
                        </div>

                        ${
                          hasReadyReview
                            ? `
                              <details class="teacher-ai-details" data-review-details="${escapeHtml(sub.submissionId)}" ${isDetailsOpen ? "open" : ""}>
                                <summary>
                                  📝 Xem chi tiết bài sửa (${errCountText}Level ${escapeHtml(rev.target_level || sub.targetLevel)}${sub.evaluatedBand ? ` - ${escapeHtml(sub.evaluatedBand)}` : ""})
                                </summary>
                                ${
                                  reviewJson
                                    ? CLOUD.renderWritingReviewHtml(sub.content || "", reviewJson, {
                                        targetLevel: rev.target_level || sub.targetLevel
                                      })
                                    : `<div style="padding:14px;font-size:13px;color:#52525B;">${isLoadingReviews ? "⏳ Đang tải chi tiết bài sửa..." : "Đang chuẩn bị nội dung bài sửa..."}</div>`
                                }
                              </details>
                            `
                            : ""
                        }

                        <div class="grade-row">
                          <input
                            type="text"
                            class="form-input grade-score-input"
                            placeholder="Điểm / Mức (VD: 7.5 - B2)"
                            value="${escapeHtml(scoreVal)}"
                            id="inp-score-${escapeHtml(sub.submissionId)}"
                          />
                          <input
                            type="text"
                            class="form-input grade-fb-input"
                            placeholder="Nhận xét thêm của Giáo viên (hiển thị ngay dưới bài viết)..."
                            value="${escapeHtml(fbVal)}"
                            id="inp-fb-${escapeHtml(sub.submissionId)}"
                          />
                          <button
                            type="button"
                            class="save-grade-btn"
                            data-save-grade="${escapeHtml(sub.submissionId)}"
                          >
                            ${tState.savedToastId === sub.submissionId ? "✓ Đã lưu!" : "Lưu nhận xét"}
                          </button>
                        </div>
                      </div>
                    `;
                  })
                  .join("")
          }
        `;
      }

      function renderStudentInfoModal() {
        if (!tState.infoModalStudentId) return "";
        const st = tState.students.find(s => s.id === tState.infoModalStudentId);
        if (!st) return "";

        return `
          <div class="modal-backdrop" id="student-info-backdrop">
            <div class="modal-panel student-info-modal-panel" onclick="event.stopPropagation()">
              <div class="modal-header">
                <div>
                  <h2 style="font-size:16.5px;font-weight:900;color:#18181B;">
                    Thông tin học viên
                  </h2>
                </div>
                <button type="button" class="close-modal-btn" id="btn-close-student-info" aria-label="Đóng">✕</button>
              </div>

              <div class="modal-body">
                <div class="student-info-list">
                  <div class="student-info-row">
                    <span class="student-info-label">Họ và tên</span>
                    <span class="student-info-value">
                      <strong>${escapeHtml(st.name)}</strong>
                      ${st.className ? ` ${renderClassBadge(st.className)}` : ""}
                    </span>
                  </div>

                  <div class="student-info-row">
                    <span class="student-info-label">Địa chỉ Email</span>
                    <span class="student-info-value" style="word-break:break-all;">${escapeHtml(st.email || "—")}</span>
                  </div>

                  <div class="student-info-row">
                    <span class="student-info-label">Đăng nhập qua</span>
                    <span class="student-info-value">
                      <span class="provider-pill ${st.authProvider === "google" ? "google" : ""}">
                        ${st.authProvider === "google" ? "Google" : "Email"}
                      </span>
                    </span>
                  </div>

                  <div class="student-info-row">
                    <span class="student-info-label">Bài đã nộp</span>
                    <span class="student-info-value">
                      <strong>${st.submittedCount}</strong> bài (Task 1: ${st.task1Count} - Task 2: ${st.task2Count})
                    </span>
                  </div>

                  <div class="student-info-row">
                    <span class="student-info-label">Ngày tham gia</span>
                    <span class="student-info-value">${escapeHtml(st.createdAt || "—")}</span>
                  </div>

                  <div class="student-info-row">
                    <span class="student-info-label">Hoạt động gần nhất</span>
                    <span class="student-info-value">${escapeHtml(st.lastActiveAt || "—")}</span>
                  </div>
                </div>

                ${
                  st.id !== tState.teacherUserId
                    ? `
                    <div class="student-info-danger-box">
                      <button
                        type="button"
                        class="btn-danger-outline"
                        style="width:100%;justify-content:center;height:38px;"
                        data-delete-student="${escapeHtml(st.id)}"
                        data-delete-student-name="${escapeHtml(st.name)}"
                        data-delete-student-email="${escapeHtml(st.email)}"
                        ${tState.deletingUserId === st.id ? "disabled" : ""}
                      >
                        ${tState.deletingUserId === st.id ? "Đang xoá tài khoản..." : "🗑️ Xoá tài khoản học viên"}
                      </button>
                    </div>
                  `
                    : ""
                }
              </div>
            </div>
          </div>
        `;
      }

      function renderTeacherDashboard() {
        const totalSubmitted = tState.submissions.filter(s => s.isSubmitted).length;
        const totalUngraded = tState.submissions.filter(
          s => s.isSubmitted && !hasAnyFeedbackOrReview(s)
        ).length;
        const pendingAiCount = tState.submissions.filter(
          s => s.isSubmitted && (!s.aiReview || (s.aiReview.status !== "ready" && s.aiReview.status !== "skipped"))
        ).length;

        const selectedStudentObj = tState.selectedStudentId
          ? tState.students.find(s => s.id === tState.selectedStudentId)
          : null;

        return `
          <div class="teacher-shell">
            <header class="dt-topbar teacher-clean-topbar">
              <div class="dt-topbar-inner">
                <div class="dt-topbar-left-group">
                  <button
                    type="button"
                    class="ej-sb-logo-btn"
                    id="btn-brand-reset-view"
                    title="Về danh sách học viên"
                  >
                    <span class="ej-sb-logo-badge">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </span>
                    <div class="ej-sb-logo-text">
                      <span class="ej-sb-logo-main">Quản lý Học viên</span>
                      <span class="ej-sb-logo-sub">VSTEP Writing</span>
                    </div>
                  </button>
                </div>

                <div class="dt-topbar-right-group teacher-topbar-right">
                  <a href="./index.html?mode=practice" class="top-pill-btn" style="text-decoration:none;" title="Xem giao diện luyện tập của học viên">
                    <span>← <span class="topbar-label-full">Trang học</span></span>
                  </a>

                  ${
                    pendingAiCount > 0
                      ? `<button type="button" class="top-pill-btn yellow" id="btn-flush-queue" ${tState.flushingQueue ? "disabled" : ""}>
                          <span>${tState.flushingQueue ? escapeHtml(tState.flushProgressText || "⏳...") : `🔄 Chấm chờ (${pendingAiCount})`}</span>
                        </button>`
                      : ""
                  }

                  <button type="button" class="top-pill-btn" id="btn-refresh-data" title="Làm mới dữ liệu">
                    <span>${tState.loading ? "⏳" : "↻"} <span class="topbar-label-full">Làm mới</span></span>
                  </button>

                  <button type="button" class="top-pill-btn yellow" id="btn-export-csv" title="Xuất báo cáo Excel (.csv)">
                    <span>📊 <span class="topbar-label-full">Xuất Excel</span></span>
                  </button>

                  ${renderAccountMenuHtml()}
                </div>
              </div>
            </header>

            <main class="teacher-compact-container">
              ${
                tState.dbError
                  ? `<div style="padding:12px 16px;border:2px solid #DC2626;background:#FEF2F2;color:#B91C1C;font-size:13.5px;font-weight:700;margin-bottom:16px;border-radius:8px;">⚠️ ${escapeHtml(tState.dbError)}</div>`
                  : ""
              }

              <div class="teacher-stats-grid teacher-stats-3col">
                <div class="teacher-stat-card">
                  <div class="teacher-stat-label">Tổng số học viên</div>
                  <div class="teacher-stat-value">${tState.students.length}</div>
                </div>
                <div class="teacher-stat-card">
                  <div class="teacher-stat-label">Bài đã nộp chính thức</div>
                  <div class="teacher-stat-value" style="color:#15803D;">${totalSubmitted}</div>
                </div>
                <div class="teacher-stat-card">
                  <div class="teacher-stat-label">Bài chờ chấm / nhận xét</div>
                  <div class="teacher-stat-value" style="color:#B45309;">${totalUngraded}</div>
                </div>
              </div>

              ${
                selectedStudentObj
                  ? renderStudentSubmissionsSection(selectedStudentObj)
                  : renderStudentsTableSection()
              }
            </main>
          </div>
          ${renderStudentInfoModal()}
        `;
      }

      function renderTeacherApp() {
        const root = document.getElementById("teacher-app");
        if (!root) return;
        captureDraftGradesFromDom();
        if (tState.checkingAuth) {
          root.innerHTML = renderCheckingAuthView();
        } else if (tState.unauthorizedEmail) {
          root.innerHTML = renderUnauthorizedView();
        } else if (tState.authenticated) {
          root.innerHTML = renderTeacherDashboard();
        } else {
          root.innerHTML = renderTeacherLogin();
        }
        bindTeacherEvents();
      }

      // ======================================================================
      // EVENT BINDING
      // ======================================================================
      function bindTeacherEvents() {
        const btnGoogle = document.getElementById("btn-teacher-google-login");
        if (btnGoogle) {
          btnGoogle.onclick = async () => {
            tState.loading = true;
            tState.authError = "";
            renderTeacherApp();
            const { error } = await CLOUD.signInWithGoogle();
            if (error) {
              tState.loading = false;
              tState.authError = "Lỗi đăng nhập Google: " + error.message;
              renderTeacherApp();
            }
          };
        }

        const cloudEmailForm = document.getElementById("teacher-cloud-email-form");
        if (cloudEmailForm) {
          cloudEmailForm.onsubmit = async e => {
            e.preventDefault();
            const client = CLOUD.getClient();
            if (!client) {
              tState.authError = "Chưa cấu hình kết nối Supabase.";
              renderTeacherApp();
              return;
            }
            const email = (document.getElementById("inp-teacher-email").value || "").trim().toLowerCase();
            const password = (document.getElementById("inp-teacher-pass").value || "").trim();
            tState.loading = true;
            tState.authError = "";
            renderTeacherApp();
            const { data, error } = await client.auth.signInWithPassword({ email, password });
            if (error || !data || !data.user) {
              tState.loading = false;
              tState.authError = "Email hoặc mật khẩu chưa đúng.";
              renderTeacherApp();
              return;
            }
            await verifyAndLoadCloudTeacher(data.user);
          };
        }

        const btnToggleAcc = document.getElementById("btn-toggle-account-menu");
        if (btnToggleAcc) {
          btnToggleAcc.onclick = e => {
            e.stopPropagation();
            tState.accountMenuOpen = !tState.accountMenuOpen;
            renderTeacherApp();
          };
        }

        const performTeacherLogout = async () => {
          tState.accountMenuOpen = false;
          const client = CLOUD.getClient();
          if (client) {
            try {
              await client.auth.signOut();
            } catch (e) {}
          }
          tState.authenticated = false;
          tState.unauthorizedEmail = "";
          tState.teacherEmail = "";
          tState.teacherUserId = "";
          tState.deletingUserId = "";
          tState.selectedStudentId = "";
          tState.infoModalStudentId = "";
          tState.openDetailsSubIds.clear();
          tState.draftGradesBySubId = {};
          tState.reviewJsonBySubId = {};
          tState.loadedReviewStudents.clear();
          renderTeacherApp();
        };

        ["btn-teacher-logout", "btn-teacher-unauth-logout"].forEach(id => {
          const btnLogout = document.getElementById(id);
          if (btnLogout) {
            btnLogout.onclick = performTeacherLogout;
          }
        });

        const btnBrandReset = document.getElementById("btn-brand-reset-view");
        if (btnBrandReset) {
          btnBrandReset.onclick = () => {
            tState.selectedStudentId = "";
            tState.filterStatus = "all";
            renderTeacherApp();
          };
        }

        const btnBackStudents = document.getElementById("btn-back-to-students");
        if (btnBackStudents) {
          btnBackStudents.onclick = () => {
            tState.selectedStudentId = "";
            tState.filterStatus = "all";
            renderTeacherApp();
          };
        }

        const btnRefresh = document.getElementById("btn-refresh-data");
        if (btnRefresh) {
          btnRefresh.onclick = () => refreshCloudDashboardData();
        }

        const btnFlushQueue = document.getElementById("btn-flush-queue");
        if (btnFlushQueue) {
          btnFlushQueue.onclick = () => flushPendingQueueNow();
        }

        const btnExportCsv = document.getElementById("btn-export-csv");
        if (btnExportCsv) {
          btnExportCsv.onclick = () =>
            exportCsvReport(getFilteredSubmissionsForStudent(tState.selectedStudentId || ""));
        }

        const btnResetFilters = document.getElementById("btn-reset-filters");
        if (btnResetFilters) {
          btnResetFilters.onclick = () => {
            if (!tState.selectedStudentId) {
              tState.filterClass = "all";
            }
            tState.filterLevel = "all";
            tState.filterTask = "all";
            tState.filterLesson = "all";
            tState.filterStatus = "all";
            renderTeacherApp();
          };
        }

        document.querySelectorAll("[data-open-student-info]").forEach(btn => {
          btn.onclick = e => {
            e.stopPropagation();
            tState.infoModalStudentId = btn.getAttribute("data-open-student-info") || "";
            renderTeacherApp();
          };
        });

        ["student-info-backdrop", "btn-close-student-info"].forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.onclick = () => {
              tState.infoModalStudentId = "";
              renderTeacherApp();
            };
          }
        });

        document.querySelectorAll("[data-view-student-subs]").forEach(btn => {
          btn.onclick = () => {
            const sid = btn.getAttribute("data-view-student-subs") || "";
            tState.selectedStudentId = sid;
            renderTeacherApp();
            if (sid) {
              ensureStudentReviewsLoaded(sid);
            }
            window.scrollTo({ top: 0, behavior: "smooth" });
          };
        });

        document.querySelectorAll("[data-delete-student]").forEach(btn => {
          btn.onclick = () => {
            deleteStudentAccount(
              btn.getAttribute("data-delete-student"),
              btn.getAttribute("data-delete-student-name"),
              btn.getAttribute("data-delete-student-email")
            );
          };
        });

        const selFilterClass = document.getElementById("sel-filter-class");
        if (selFilterClass) {
          selFilterClass.onchange = e => {
            tState.filterClass = e.target.value;
            renderTeacherApp();
          };
        }

        const selFilterLevel = document.getElementById("sel-filter-level");
        if (selFilterLevel) {
          selFilterLevel.onchange = e => {
            tState.filterLevel = e.target.value;
            renderTeacherApp();
          };
        }

        const selTask = document.getElementById("sel-filter-task");
        if (selTask) {
          selTask.onchange = e => {
            tState.filterTask = e.target.value;
            if (tState.filterLesson !== "all") {
              const stillValid = getVisibleLessonsForTask().some(l => l.id === tState.filterLesson);
              if (!stillValid) tState.filterLesson = "all";
            }
            renderTeacherApp();
          };
        }

        const selLesson = document.getElementById("sel-filter-lesson");
        if (selLesson) {
          selLesson.onchange = e => {
            tState.filterLesson = e.target.value;
            renderTeacherApp();
          };
        }

        const selStatus = document.getElementById("sel-filter-status");
        if (selStatus) {
          selStatus.onchange = e => {
            tState.filterStatus = e.target.value;
            renderTeacherApp();
          };
        }

        document.querySelectorAll("[data-review-details]").forEach(detailsEl => {
          detailsEl.addEventListener("toggle", () => {
            const subId = detailsEl.getAttribute("data-review-details");
            if (!subId) return;
            if (detailsEl.open) {
              tState.openDetailsSubIds.add(subId);
              if (tState.selectedStudentId) {
                ensureStudentReviewsLoaded(tState.selectedStudentId);
              }
            } else {
              tState.openDetailsSubIds.delete(subId);
            }
          });
        });

        document.querySelectorAll("[data-save-grade]").forEach(btn => {
          btn.onclick = async () => {
            const subId = btn.getAttribute("data-save-grade");
            const scoreInp = document.getElementById("inp-score-" + subId);
            const fbInp = document.getElementById("inp-fb-" + subId);
            await saveCloudGrade(
              subId,
              scoreInp ? scoreInp.value.trim() : "",
              fbInp ? fbInp.value.trim() : ""
            );
          };
        });

        document.querySelectorAll("[data-ai-grade]").forEach(btn => {
          btn.onclick = () => triggerTeacherAiGrade(btn.getAttribute("data-ai-grade"));
        });

        document.querySelectorAll("[data-release-now]").forEach(btn => {
          btn.onclick = () => releaseAiReviewNow(btn.getAttribute("data-release-now"));
        });

        document.querySelectorAll("[data-delete-submission]").forEach(btn => {
          btn.onclick = () => deleteSubmissionForRetry(btn.getAttribute("data-delete-submission"));
        });
      }

      document.addEventListener("click", e => {
        if (tState.accountMenuOpen && !e.target.closest("#teacher-account-menu-wrap")) {
          tState.accountMenuOpen = false;
          renderTeacherApp();
        }
      });

      document.addEventListener("keydown", e => {
        if (e.key === "Escape" && (tState.accountMenuOpen || tState.infoModalStudentId)) {
          tState.accountMenuOpen = false;
          tState.infoModalStudentId = "";
          renderTeacherApp();
        }
      });

      window.addEventListener("DOMContentLoaded", async () => {
        const client = CLOUD.getClient();
        if (!client) {
          tState.checkingAuth = false;
          tState.authError = "Chưa cấu hình kết nối Supabase.";
          renderTeacherApp();
          return;
        }

        renderTeacherApp();
        const { data } = await client.auth.getSession();
        if (data && data.session && data.session.user) {
          await verifyAndLoadCloudTeacher(data.session.user);
        } else {
          tState.checkingAuth = false;
          renderTeacherApp();
        }

        client.auth.onAuthStateChange(async (event, session) => {
          if (event === "SIGNED_IN" && session && session.user && !tState.authenticated && !tState.unauthorizedEmail) {
            await verifyAndLoadCloudTeacher(session.user);
          } else if (event === "SIGNED_OUT") {
            tState.checkingAuth = false;
            tState.authenticated = false;
            tState.unauthorizedEmail = "";
            tState.teacherEmail = "";
            tState.teacherUserId = "";
            tState.deletingUserId = "";
            tState.selectedStudentId = "";
            tState.infoModalStudentId = "";
            tState.openDetailsSubIds.clear();
            tState.draftGradesBySubId = {};
            tState.reviewJsonBySubId = {};
            tState.loadedReviewStudents.clear();
            renderTeacherApp();
          }
        });
      });
    })();
  </script>
</body>
</html>
